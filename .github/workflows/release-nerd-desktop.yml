name: Release T3 Code Nerd

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match the fork package version)
        required: true
        type: string
      signed:
        description: Build a signed, updater-capable release when Apple secrets are configured
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - id: release_version
        name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version." >&2
            exit 1
          fi
          package_version="$(node -p 'require("./apps/desktop/package.json").version')"
          if [[ "$RELEASE_VERSION_INPUT" != "$package_version" ]]; then
            echo "Release version must match the checked-out desktop package version." >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION_INPUT" >> "$GITHUB_OUTPUT"
      - name: Verify public desktop build configuration
        shell: bash
        run: |
          required=(
            T3CODE_CLERK_PUBLISHABLE_KEY
            T3CODE_CLERK_JWT_TEMPLATE
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID
            T3CODE_RELAY_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required public desktop build configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - id: signing
        shell: bash
        env:
          SIGNED_INPUT: ${{ inputs.signed }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ "$SIGNED_INPUT" != true ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$MACOS_PROVISIONING_PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signed Nerd releases require CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_TEAM_ID, and MACOS_PROVISIONING_PROFILE." >&2
            exit 1
          fi
      - name: Prepare Apple signing inputs
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          profile_path="$RUNNER_TEMP/t3code.provisionprofile"
          profile_plist="$RUNNER_TEMP/t3code.provisionprofile.plist"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          if [[ "$profile_app_id" != "${APPLE_TEAM_ID}.com.vrybakk.t3code.nerd" ]]; then
            echo "The provisioning profile does not match the T3 Code Nerd application identifier." >&2
            exit 1
          fi
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "T3CODE_APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "T3CODE_MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
      - run: vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --edition nerd --build-version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          T3CODE_DESKTOP_SIGNED: ${{ steps.signing.outputs.enabled }}
          CSC_LINK: ${{ steps.signing.outputs.enabled == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
      - uses: actions/upload-artifact@v8
        if: steps.signing.outputs.enabled != 'true'
        with:
          name: t3-code-nerd-macos-${{ steps.release_version.outputs.version }}
          path: release/T3-Code-Nerd-*
      - uses: actions/upload-artifact@v8
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: t3-code-nerd-macos-${{ steps.release_version.outputs.version }}
          path: |
            release/T3-Code-Nerd-*
            release/*-mac.yml
      - name: Publish signed updater release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          tag="nerd-v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq .target_commitish)"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Existing release tag does not target this workflow commit." >&2
              exit 1
            fi
            exit 0
          fi
          gh release create "$tag" release/T3-Code-Nerd-* release/*-mac.yml --target "$GITHUB_SHA" --title "T3 Code Nerd $RELEASE_VERSION" --generate-notes
